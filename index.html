<title>Hamsika Tours & Travels</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f8fa;--card:#fff;--tx:#14262e;--pr:#0b6e8a;--dk:#08475a;--ac:#f59e0b;--bd:#cfdde4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a20;--card:#16262e;--tx:#e6f1f5;--pr:#3aa6c4;--dk:#0a2f3b;--bd:#2c4651}}
:root[data-theme="dark"]{--bg:#0e1a20;--card:#16262e;--tx:#e6f1f5;--pr:#3aa6c4;--dk:#0a2f3b;--bd:#2c4651}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Arial,sans-serif}
nav{background:var(--dk);display:flex;flex-wrap:wrap;gap:6px 14px;padding:12px 5%;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav b{color:#fff;margin-right:auto;font-size:1.1rem}nav a{color:#cfeaf2;cursor:pointer;font-size:.92rem}nav a.on,nav a:hover{color:var(--ac)}
.hero{background:linear-gradient(135deg,var(--pr),var(--dk));color:#fff;text-align:center;padding:52px 5%}
.hero h1{margin:0 0 8px;font-size:clamp(1.7rem,5vw,2.8rem)}main{max-width:1050px;margin:auto;padding:24px 5%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card,.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}.box{max-width:520px}
.tag{background:var(--ac);color:#000;border-radius:20px;padding:2px 10px;font-size:.72rem}.price{font-size:1.25rem;font-weight:700;color:var(--pr)}
input,select,textarea{width:100%;padding:10px;margin:3px 0 10px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:var(--bg);color:var(--tx)}
button{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;cursor:pointer}button.alt{background:var(--ac);color:#000}
.msg{padding:10px;border-radius:8px;margin:10px 0;background:rgba(34,160,90,.18)}.err{background:rgba(220,60,60,.18)}
.sc{overflow-x:auto;margin-bottom:20px}table{border-collapse:collapse;width:100%;font-size:.8rem}th,td{border:1px solid var(--bd);padding:6px;text-align:left;white-space:nowrap}
.tabs button{margin:0 6px 12px 0;background:var(--card);color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--pr);color:#fff}
.tick{background:var(--dk);color:#fff;overflow:hidden;white-space:nowrap;border-top:1px solid #fff2}.tk{display:inline-block;padding:8px 0;animation:sc 40s linear infinite}.tick:hover .tk{animation-play-state:paused}
.tk span{margin:0 22px}.tk b{color:var(--ac)}@keyframes sc{to{transform:translateX(-50%)}}
.lg{height:40px;width:40px;border-radius:8px;background:#fff;vertical-align:middle;margin-right:8px}.bs{padding:3px 9px;font-size:.75rem;margin-right:4px}.del{background:#c0392b}
footer{text-align:center;padding:24px;opacity:.7;font-size:.85rem}
</style></head><body>

const toP=a=>({name:a[0],type:a[1],destination:a[2],nights:a[3],price:a[4],highlights:a[5]});
const FX0={INR:1,USD:88,EUR:102,GBP:118,AED:24,SGD:68,THB:2.7,MYR:20,JPY:0.6,AUD:58};
let PKS=D0.map(toP),RATES={...FX0};
// Admin credentials: PBKDF2-SHA256 hash only (no plain text stored)
const SALT="a1b2c3d4e5f60718293a4b5c6d7e8f90",HASH="39ba086f5096bd6f2a96a37c158850ef63496b9e283068303dc26fac0e1736f5";
const SC={
packages:{t:"Packages",k:"doc",f:[["name"],["type","domestic|international"],["destination"],["nights","number"],["price","number"],["highlights"],["source","Own|TravClan|SeatSeller"]]},
rates:{t:"Currency rates (INR per 1 unit)",k:"doc",f:[["code"],["inr","number"]]},
enquiries:{t:"Package enquiries",k:"items",f:[["name"],["email"],["phone"],["package"],["travellers","number"],["travel_date","date"],["message"]]},
flight_requests:{t:"Flight requests",k:"items",f:[["name"],["email"],["phone"],["origin"],["destination"],["depart","date"],["ret","date"],["pax","number"],["trip"]]},

currency_requests:{t:"Currency requests",k:"items",f:[["name"],["phone"],["amount","number"],["from"],["to"],["rate","number"],["result","number"]]}};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let db=null,isAdmin=false,view="home",filt="all",at="packages",ROWS=[];
async function loadPub(){if(!db)return;
 try{const p=(await db.collection("packages").get()).docs.map(d=>({_id:d.id,...d.data()}));if(p.length)PKS=p}catch(e){}
 try{const r=(await db.collection("rates").get()).docs.map(d=>d.data());if(r.length){RATES={INR:1};r.forEach(x=>RATES[x.code]=+x.inr)}}catch(e){}}
(async()=>{try{db=await claude.use("db")}catch(e){}await loadPub();if(["home","packages","currency"].includes(view))R[view]()})();
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
async function pbk(txt){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(txt),"PBKDF2",false,["deriveBits"]);
 const s=Uint8Array.from(SALT.match(/../g).map(h=>parseInt(h,16)));
 return hex(await crypto.subtle.deriveBits({name:"PBKDF2",salt:s,iterations:100000,hash:"SHA-256"},k,256))}
async function save(col,data){if(!db)return false;try{const u=await claude.use("user");const id=await u.id();const ref=db.collection(col).doc(id);let items=[];
 try{const s=await ref.get();if(s.exists)items=s.data().items||[]}catch(e){}
 items.push({...data,ts:Date.now()});await ref.set({items});return true}catch(e){return false}}
const OK=ok=>ok?'<div class="msg">✅ Saved! Our team will contact you shortly.</div>':'<div class="msg err">Could not save right now. Please sign in to Claude to submit, or try again.</div>';
const fld=(n,l,t="text",x="")=>`<label>${l}<input name="${n}" type="${t}" ${x}></label>`;
const card=p=>`<div class="card"><span class="tag">${esc(p.type)}</span><h3>${esc(p.name)}</h3><p>${esc(p.destination)} · ${p.nights}N/${+p.nights+1}D</p><p>${esc(p.highlights)}</p><div class="price">₹${(+p.price).toLocaleString("en-IN")} <small>/person</small></div><br><button onclick="enq(this.dataset.n)" data-n="${esc(p.name)}">Enquire / Book</button></div>`;
function nav(){const t=[["home","Home"],["packages","Packages"],["flights","Flights"],["hotels","Hotels"],["currency","Currency Exchange"],["admin","Admin"]];
 $("#nav").innerHTML='<b><img src="'+LOGO+'" alt="Hamsika logo" class="lg">Hamsika Tours &amp; Travels</b>'+t.map(x=>`<a class="${view==x[0]?"on":""}" onclick="go('${x[0]}')">${x[1]}</a>`).join("")}
function go(v){view=v;nav();R[v]();scrollTo(0,0)}
function tick(){const t=Object.keys(RATES).filter(c=>c!="INR").map(c=>`<span><b>${c}</b> ₹${(+RATES[c]).toFixed(2)}</span>`).join("");return `<div class="tick"><div class="tk">${t}${t}</div></div>`}
function form(title,fields,extra=""){return `<main><div class="box"><h2>${title}</h2><form id="f">${fld("name","Name","text","required")}${fld("email","Email","email")}${fld("phone","Phone","tel","required")}${fields}<button>Submit</button></form><div id="out"></div></div>${extra}</main>`}
function wire(col){$("#f").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const ok=await save(col,d);$("#out").innerHTML=OK(ok);if(ok)e.target.reset()}}
function enq(name){view="enq";nav();$("#app").innerHTML=form("Enquire: "+esc(name),fld("travellers","Travellers","number",'value="2" min="1"')+fld("travel_date","Travel date","date")+'<label>Message<textarea name="message"></textarea></label><input type="hidden" name="package" value="'+esc(name)+'">');wire("enquiries")}
const R={
home(){$("#app").innerHTML=`<div class="hero"><img src="${LOGO}" alt="Hamsika Tour &amp; Travel" style="height:110px;width:110px;border-radius:50%;background:#fff;margin-bottom:10px"><h1>Explore India &amp; the World</h1><p>Domestic &amp; international packages · Flights · Hotels · Currency exchange</p><button class="alt" onclick="go('packages')">View Packages</button></div>${tick()}<main><h2>Popular Packages</h2><div class="grid">${PKS.slice(0,6).map(card).join("")}</div><p><small>Currency values are indicative INR rates maintained by Hamsika Tours.</small></p></main>`},
packages(){$("#app").innerHTML=`<main><h2>Our Packages</h2><div class="tabs">${["all","domestic","international"].map(f=>`<button class="${filt==f?"on":""}" onclick="filt='${f}';R.packages()">${f[0].toUpperCase()+f.slice(1)}</button>`).join("")}</div><div class="grid">${PKS.filter(p=>filt=="all"||p.type==filt).map(card).join("")}</div></main>`},
flights(){$("#app").innerHTML=form("Flight Tickets (Domestic &amp; International)",fld("origin","From (city/airport)","text","required")+fld("destination","To (city/airport)","text","required")+fld("depart","Depart","date","required")+fld("ret","Return","date")+fld("pax","Passengers","number",'value="1" min="1"')+'<label>Trip<select name="trip"><option>Domestic</option><option>International</option></select></label>','<p style="margin-top:14px">Open fare check: <a href="https://www.google.com/travel/flights" target="_blank" rel="noopener">Google Flights</a></p>');wire("flight_requests")},
hotels(){$("#app").innerHTML=form("Hotels &amp; Accommodation",fld("city","City / Destination","text","required")+fld("checkin","Check-in","date")+fld("checkout","Check-out","date")+fld("guests","Guests","number",'value="2" min="1"')+'<label>Type<select name="trip"><option>Domestic</option><option>International</option></select></label>');wire("hotel_requests")},
currency(){const o=Object.keys(RATES).map(c=>`<option>${c}</option>`).join("");
 $("#app").innerHTML=`${tick()}<main><div class="box"><h2>Currency Exchange</h2><form id="f">${fld("name","Name","text","required")}${fld("phone","Phone","tel","required")}${fld("amount","Amount","number",'value="10000" step="any" required')}<label>From<select name="from">${o}</select></label><label>To<select name="to">${o}</select></label><button>Convert &amp; Request</button></form><div id="out"></div><p><small>Indicative rates. Final rate confirmed at our counter.</small></p></div></main>`;
 $("[name=to]").value=RATES.USD?"USD":"INR";
 $("#f").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const a=+d.amount,r=RATES[d.from]/RATES[d.to],res=+(a*r).toFixed(2);
  const ok=await save("currency_requests",{...d,rate:+r.toFixed(6),result:res});$("#out").innerHTML=`<div class="msg">${a} ${d.from} ≈ <b>${res} ${d.to}</b></div>`+(ok?"":OK(false))}},
admin(){if(isAdmin)return dash();$("#app").innerHTML=`<main><div class="box"><h2>Admin Login</h2><form id="f">${fld("u","Username","text","required")}${fld("p","Password","password","required")}<button>Login</button></form><div id="out"></div></div></main>`;
 $("#f").onsubmit=async e=>{e.preventDefault();const h=await pbk($("[name=u]").value+":"+$("[name=p]").value);if(h===HASH){isAdmin=true;dash()}else $("#out").innerHTML='<div class="msg err">Invalid credentials.</div>'}}};
// ---------- Admin: full create / edit / delete ----------
async function rows(c){const k=SC[c].k;const ds=(await db.collection(c).get()).docs;
 return k=="doc"?ds.map(d=>({_id:d.id,...d.data()})):ds.flatMap(d=>(d.data().items||[]).map((r,i)=>({...r,_id:d.id,_i:i}))).sort((a,b)=>(b.ts||0)-(a.ts||0))}
async function dash(){const sc=SC[at];
 $("#app").innerHTML=`<main><h2>Admin Dashboard <button class="alt" onclick="isAdmin=false;go('home')" style="float:right">Logout</button></h2><div class="tabs">${Object.keys(SC).map(c=>`<button class="${at==c?"on":""}" onclick="at='${c}';dash()">${SC[c].t}</button>`).join("")}</div><div id="ed"></div><div id="d">Loading…</div></main>`;
 if(!db){$("#d").innerHTML='<div class="msg err">Database unavailable. Open this site while signed in as owner.</div>';return}
 try{ROWS=await rows(at)}catch(e){$("#d").innerHTML='<div class="msg err">Cannot read (owner access required).</div>';return}
 const seed=(at=="packages"||at=="rates")&&!ROWS.length?'<button class="alt" onclick="seed()">Load default '+at+'</button> ':'';
 const f=sc.f.map(x=>x[0]);
 $("#d").innerHTML=`<p><button onclick="ed(null)">+ New</button> ${at=="packages"?'<button class="alt" onclick="imp()">Import CSV</button> ':""}${seed}(${ROWS.length})</p><div class="sc">${ROWS.length?`<table><tr><th></th>${f.map(x=>`<th>${x}</th>`).join("")}<th>ts</th></tr>${ROWS.map((r,i)=>`<tr><td><button class="bs" onclick="ed(${i})">Edit</button><button class="bs del" onclick="del(${i})">Delete</button></td>${f.map(x=>`<td>${esc(r[x])}</td>`).join("")}<td>${r.ts?new Date(r.ts).toLocaleString():""}</td></tr>`).join("")}</table>`:"No records yet."}</div>`}
function ed(i){const sc=SC[at],r=i==null?{}:ROWS[i];
 $("#ed").innerHTML=`<div class="box" style="margin-bottom:16px"><h3>${i==null?"Create new":"Edit"}</h3><form id="ef">${sc.f.map(([n,t])=>t&&t.includes("|")?`<label>${n}<select name="${n}">${t.split("|").map(o=>`<option ${r[n]==o?"selected":""}>${o}</option>`).join("")}</select></label>`:`<label>${n}<input name="${n}" type="${t||"text"}" step="any" value="${esc(r[n])}"></label>`).join("")}<button>Save</button> <button type="button" class="alt" onclick="$('#ed').innerHTML=''">Cancel</button></form></div>`;
 $("#ef").onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));sc.f.forEach(([n,t])=>{if(t=="number"&&o[n]!=="")o[n]=+o[n]});
  try{const ref=db.collection(at);
   if(sc.k=="doc"){const id=at=="rates"?String(o.code).toUpperCase():(r._id||"p"+Date.now());if(at=="rates")o.code=id;await ref.doc(id).set(o)}
   else{const d=ref.doc(r._id||"admin");let it=[];try{const s=await d.get();if(s.exists)it=s.data().items||[]}catch(x){}
    if(i==null)it.push({...o,ts:Date.now()});else it[r._i]={...o,ts:r.ts||Date.now()};await d.set({items:it})}
   await loadPub();dash()}catch(x){$("#ed").insertAdjacentHTML("afterbegin",'<div class="msg err">Save failed: '+esc(x.message||x.code||x)+'</div>')}}}
async function del(i){const r=ROWS[i];if(!confirm("Delete this record permanently?"))return;
 try{const ref=db.collection(at);if(SC[at].k=="doc")await ref.doc(r._id).delete();
  else{const d=ref.doc(r._id),s=await d.get(),it=s.data().items||[];it.splice(r._i,1);await d.set({items:it})}
  await loadPub();dash()}catch(x){alert("Delete failed")}}
async function seed(){try{if(at=="packages")for(const [i,a] of D0.entries())await db.collection("packages").doc("p"+i).set(toP(a));
 else for(const [c,v] of Object.entries(FX0))if(c!="INR")await db.collection("rates").doc(c).set({code:c,inr:v});await loadPub();dash()}catch(x){alert("Seed failed")}}
function imp(){$("#ed").innerHTML=`<div class="box" style="margin-bottom:16px"><h3>Import packages (CSV)</h3><p><small>Export or copy from your TravClan / SeatSeller agent portal, then paste one package per line:<br><b>name,type,destination,nights,price,source,highlights</b><br>type = domestic or international; source = TravClan or SeatSeller.</small></p><textarea id="csv" rows="7"></textarea><button onclick="doImp()">Import</button> <button class="alt" onclick="$('#ed').innerHTML=''">Cancel</button></div>`}
async function doImp(){const L=$("#csv").value.split("\n").map(x=>x.trim()).filter(x=>x&&!/^name,/i.test(x));let n=0;
 try{for(const l of L){const a=l.split(",");if(a.length<5)continue;await db.collection("packages").doc("p"+Date.now()+n++).set({name:a[0].trim(),type:(a[1]||"").trim().toLowerCase()=="international"?"international":"domestic",destination:a[2].trim(),nights:+a[3],price:+a[4],source:(a[5]||"Own").trim(),highlights:a.slice(6).join(",").trim()})}
  await loadPub();dash()}catch(x){alert("Import failed after "+n+" rows")}}
go("home");
</script></body></html>
